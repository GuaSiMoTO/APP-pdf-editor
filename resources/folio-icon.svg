<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560">
  <!-- Icono de Folio redibujado en vectorial a partir de resources/icon.png.
       Fondo a sangre (iOS/Android aplican su propia máscara redondeada). -->
  <defs>
    <linearGradient id="base" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#005cfc"/>
      <stop offset="0.5" stop-color="#1733ea"/>
      <stop offset="1" stop-color="#7419f3"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="0.62">
      <stop offset="0" stop-color="#00e8fa"/>
      <stop offset="1" stop-color="#00e8fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="1" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a32ff9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a32ff9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDeep" cx="0.5" cy="1" r="0.55">
      <stop offset="0" stop-color="#2a14f5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2a14f5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#08104a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="560" height="560" fill="url(#base)"/>
  <rect width="560" height="560" fill="url(#glowCyan)"/>
  <rect width="560" height="560" fill="url(#glowViolet)"/>
  <rect width="560" height="560" fill="url(#glowDeep)"/>

  <g id="glyph" transform="translate(0 8)" filter="url(#shadow)">
    <!-- Contorno del documento (abierto abajo a la derecha) -->
    <path d="M411 268 V217 L313 119 H191 Q151 119 151 159 V376 Q151 416 191 416 H318"
      fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Esquina doblada -->
    <path d="M305 119 V193 Q305 215 327 215 H411 V217 L313 119 Z" fill="#fff"/>
    <!-- Punto -->
    <circle cx="400.5" cy="364" r="52.5" fill="#fd4146"/>
  </g>
</svg>
